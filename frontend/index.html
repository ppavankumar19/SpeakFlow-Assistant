<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Voice Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0609;
      --surface:     rgba(18, 8, 14, 0.95);
      --surface2:    rgba(28, 12, 22, 0.85);
      --border:      rgba(244, 63, 94, 0.18);
      --accent:      #f43f5e;
      --accent2:     #a855f7;
      --accent-glow: rgba(244, 63, 94, 0.35);
      --text:        #f5e6ea;
      --text-muted:  #9e7a84;
      --user-bg:     #f43f5e;
      --ai-bg:       rgba(28, 12, 22, 0.9);
      --danger:      #ef4444;
      --success:     #22c55e;
      --warning:     #f59e0b;
      --radius:      16px;
      --sidebar-w:   285px;
      --font:        'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      overflow: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(244,63,94,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244,63,94,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* AI watermark logo - centered behind chat */
    .ai-watermark {
      position: fixed;
      top: 50%;
      left: calc(var(--sidebar-w) + (100vw - var(--sidebar-w)) / 2);
      transform: translate(-50%, -50%);
      width: min(55vh, 55vw);
      height: min(55vh, 55vw);
      opacity: 0.045;
      pointer-events: none;
      z-index: 0;
    }

    body { display: flex; height: 100vh; position: relative; z-index: 1; }

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--surface);
      backdrop-filter: blur(24px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 22px 16px;
      gap: 22px;
      transition: transform 0.25s ease, width 0.25s ease, padding 0.25s ease, min-width 0.25s ease;
      overflow: hidden;
      z-index: 10;
      flex-shrink: 0;
    }

    .sidebar.collapsed {
      width: 0;
      min-width: 0;
      padding: 0;
      border: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      flex-shrink: 0;
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .new-chat-btn {
      width: 100%;
      padding: 10px;
      background: rgba(244,63,94,0.1);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .new-chat-btn:hover { background: rgba(244,63,94,0.2); border-color: var(--accent); }

    .sidebar-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .sidebar-section { display: flex; flex-direction: column; }

    .model-select {
      width: 100%;
      padding: 8px 10px;
      background: rgba(28,12,22,0.8);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }
    .model-select:focus { border-color: var(--accent); }

    .voice-settings { display: flex; flex-direction: column; gap: 10px; }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .setting-row input[type="checkbox"] { display: none; }
    .toggle-knob {
      width: 38px; height: 20px;
      background: rgba(28,12,22,0.8);
      border: 1px solid var(--border);
      border-radius: 10px;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .toggle-knob::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 12px; height: 12px;
      background: var(--text-muted);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .setting-row input:checked + .toggle-knob { background: var(--accent); border-color: var(--accent); }
    .setting-row input:checked + .toggle-knob::after { transform: translateX(18px); background: #fff; }

    .sidebar-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.ok    { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.error { background: var(--danger); }
    .status-label { color: var(--text-muted); flex: 1; }
    .status-text  { color: var(--text-muted); font-size: 0.72rem; }

    /* ── Main ────────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      position: relative;
    }

    /* ── Header ──────────────────────────────────────────── */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
      z-index: 5;
    }

    .sidebar-toggle {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1;
    }
    .sidebar-toggle:hover { background: rgba(244,63,94,0.1); color: var(--text); }

    .chat-title {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .voice-badge {
      padding: 3px 10px;
      background: rgba(168,85,247,0.12);
      border: 1px solid rgba(168,85,247,0.3);
      border-radius: 20px;
      color: var(--accent2);
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
      display: none;
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .clear-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Messages ────────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    /* ── Welcome screen ──────────────────────────────────── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      margin: auto;
      padding: 40px 20px;
      max-width: 520px;
    }

    .welcome-logo {
      width: 110px; height: 110px;
      filter: drop-shadow(0 0 24px rgba(244,63,94,0.7));
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    .welcome h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.75; }

    .welcome-mic-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 0 40px var(--accent-glow), 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.2s;
      animation: glow-pulse 2.5s ease-in-out infinite;
    }
    .welcome-mic-btn:hover { transform: scale(1.08); }
    .welcome-mic-btn svg { width: 34px; height: 34px; }

    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 30px var(--accent-glow), 0 8px 32px rgba(0,0,0,0.4); }
      50%       { box-shadow: 0 0 60px var(--accent-glow), 0 12px 40px rgba(0,0,0,0.4); }
    }

    .welcome-hint { font-size: 0.78rem; color: var(--text-muted); }

    .welcome-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip {
      padding: 7px 16px;
      background: rgba(244,63,94,0.1);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { border-color: var(--accent); background: rgba(244,63,94,0.2); }

    /* ── Message bubbles ─────────────────────────────────── */
    .msg {
      display: flex;
      gap: 12px;
      max-width: 800px;
      width: 100%;
      animation: fadeSlide 0.2s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg.ai   { align-self: flex-start; }

    .msg-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg.user .msg-avatar { background: var(--accent); color: #fff; }
    .msg.ai   .msg-avatar {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .msg-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      line-height: 1.65;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.ai .msg-bubble {
      background: var(--ai-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    /* Voice user bubble */
    .voice-user-bubble {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--accent);
      border-radius: var(--radius);
      border-bottom-right-radius: 4px;
      color: #fff;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .voice-icon { font-size: 1rem; flex-shrink: 0; }

    /* Voice response card (voice-only mode) */
    .voice-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: rgba(168,85,247,0.07);
      border: 1px solid rgba(168,85,247,0.22);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      min-width: 240px;
    }

    .voice-waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 32px;
      flex-shrink: 0;
    }
    .voice-waveform span {
      width: 3px;
      border-radius: 3px;
      background: var(--accent2);
      animation: wave 1s ease-in-out infinite;
    }
    .voice-waveform span:nth-child(1) { height: 10px; animation-delay: 0.0s; }
    .voice-waveform span:nth-child(2) { height: 18px; animation-delay: 0.1s; }
    .voice-waveform span:nth-child(3) { height: 26px; animation-delay: 0.2s; }
    .voice-waveform span:nth-child(4) { height: 20px; animation-delay: 0.3s; }
    .voice-waveform span:nth-child(5) { height: 30px; animation-delay: 0.4s; }
    .voice-waveform span:nth-child(6) { height: 22px; animation-delay: 0.5s; }
    .voice-waveform span:nth-child(7) { height: 14px; animation-delay: 0.6s; }
    .voice-waveform span:nth-child(8) { height: 8px;  animation-delay: 0.7s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
      50%       { transform: scaleY(1);   opacity: 1; }
    }

    .voice-card.done .voice-waveform span { animation: none; opacity: 0.3; transform: scaleY(0.4); }

    .voice-card-info { display: flex; flex-direction: column; gap: 3px; }
    .voice-card-label { font-size: 0.85rem; font-weight: 600; color: var(--accent2); }
    .voice-card-sub   { font-size: 0.73rem; color: rgba(168,85,247,0.65); }

    .replay-btn {
      margin-left: auto;
      background: rgba(168,85,247,0.12);
      border: 1px solid rgba(168,85,247,0.3);
      color: var(--accent2);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      display: none;
    }
    .replay-btn:hover { background: rgba(168,85,247,0.22); }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.7rem;
      color: var(--text-muted);
      padding: 0 4px;
    }
    .msg.user .msg-meta { flex-direction: row-reverse; }

    .speak-msg-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.82rem;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      line-height: 1;
    }
    .speak-msg-btn:hover { color: var(--accent2); }

    /* Typing dots */
    .typing-dots { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .typing-dots span {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    .msg-error {
      padding: 10px 14px;
      background: rgba(239,68,68,0.1);
      border: 1px solid var(--danger);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 0.85rem;
    }

    /* ── Input bar ───────────────────────────────────────── */
    .input-bar {
      border-top: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(20px);
      padding: 12px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .tts-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(168,85,247,0.07);
      border: 1px solid rgba(168,85,247,0.25);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      color: var(--accent2);
    }
    .tts-bar-label { flex: 1; }
    .stop-tts-btn {
      background: rgba(34,211,238,0.15);
      border: 1px solid rgba(168,85,247,0.35);
      color: var(--accent2);
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .stop-tts-btn:hover { background: rgba(168,85,247,0.25); }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .mic-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 10px;
      min-height: 48px;
      border-radius: 14px;
      background: rgba(244,63,94,0.12);
      border: 1px solid rgba(244,63,94,0.35);
      color: var(--accent);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .mic-btn svg { width: 20px; height: 20px; }
    .mic-label { font-size: 0.6rem; font-weight: 600; }
    .mic-btn:hover { background: rgba(244,63,94,0.22); border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
    .mic-btn.recording { background: rgba(239,68,68,0.15); border-color: var(--danger); color: var(--danger); animation: pulse-ring 1s infinite; }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      50%       { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }

    .textarea-wrap {
      flex: 1;
      background: rgba(28,12,22,0.8);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: flex-end;
      padding: 10px 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
      backdrop-filter: blur(10px);
    }
    .textarea-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(244,63,94,0.12); }

    textarea#msg-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      line-height: 1.5;
      resize: none;
      max-height: 160px;
      overflow-y: auto;
    }
    textarea#msg-input::placeholder { color: var(--text-muted); }
    textarea#msg-input::-webkit-scrollbar { width: 3px; }
    textarea#msg-input::-webkit-scrollbar-thumb { background: var(--border); }

    .send-btn {
      width: 48px; height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .send-btn svg { width: 18px; height: 18px; }
    .send-btn:hover { transform: scale(1.06); box-shadow: 0 6px 28px var(--accent-glow); }
    .send-btn:disabled { background: rgba(28,12,22,0.8); color: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; }

    .input-hint { font-size: 0.68rem; color: var(--text-muted); text-align: center; }

    /* ── Recording overlay ───────────────────────────────── */
    .record-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13,6,9,0.9);
      backdrop-filter: blur(10px);
      display: none;
      place-items: center;
      z-index: 100;
    }
    .record-overlay.active { display: grid; }

    .record-card {
      background: var(--surface);
      border: 1px solid rgba(244,63,94,0.3);
      border-radius: 28px;
      padding: 52px 60px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 80px rgba(244,63,94,0.08);
    }

    .record-pulse {
      width: 84px; height: 84px;
      background: linear-gradient(135deg, var(--danger), #f97316);
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      box-shadow: 0 0 30px rgba(239,68,68,0.5);
    }
    .record-pulse svg { width: 34px; height: 34px; color: #fff; position: relative; z-index: 1; }
    .record-pulse::before, .record-pulse::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--danger);
      animation: ripple 1.5s ease-out infinite;
    }
    .record-pulse::after { animation-delay: 0.75s; }
    @keyframes ripple {
      0%   { transform: scale(1); opacity: 0.55; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    .record-status { font-size: 1.2rem; font-weight: 700; }
    .record-hint   { font-size: 0.85rem; color: var(--text-muted); }

    .stop-record-btn {
      padding: 12px 36px;
      background: linear-gradient(135deg, var(--danger), #f97316);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      box-shadow: 0 4px 20px rgba(239,68,68,0.45);
    }
    .stop-record-btn:hover { opacity: 0.9; }

    /* ── Toast notifications ─────────────────────────────────── */
    .toast-container {
      position: fixed;
      bottom: 110px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 300;
      pointer-events: none;
    }
    .toast {
      padding: 10px 16px;
      background: rgba(18, 8, 14, 0.97);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.84rem;
      line-height: 1.5;
      backdrop-filter: blur(14px);
      pointer-events: auto;
      max-width: 300px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      animation: toastIn 0.2s ease, toastOut 0.35s ease 2.65s forwards;
    }
    .toast.error   { border-color: var(--danger);  color: #fca5a5; }
    .toast.warning { border-color: var(--warning);  color: #fde68a; }
    .toast.info    { border-color: rgba(168,85,247,0.5); color: var(--accent2); }
    @keyframes toastIn  { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(16px); } }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 640px) {
      .sidebar { position: absolute; z-index: 50; height: 100%; }
      .sidebar.collapsed { transform: translateX(-100%); width: var(--sidebar-w); }
      .ai-watermark { left: 50%; }
      .welcome h1 { font-size: 1.5rem; }
    }
  </style>
</head>

  <!-- ── Sidebar ─────────────────────────────────────────── -->

  <!-- ── Toast notifications ───────────────────────────── -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ── Recording overlay ──────────────────────────────── -->
  <div class="record-overlay" id="record-overlay">
    <div class="record-card">
      <div class="record-pulse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="9" y="2" width="6" height="12" rx="3"/>

  <script>
    'use strict';

    const API = '';

    let history      = [];
    let isStreaming  = false;
    let mediaRecorder = null;
    let audioChunks  = [];
    let currentUtterance = null;
    let currentAudio = null;
    let browserRecognition = null;

    const $ = id => document.getElementById(id);
    const messagesEl    = $('messages');
    const msgInput      = $('msg-input');
    const sendBtn       = $('send-btn');
    const micBtn        = $('mic-btn');
    const modelSelect   = $('model-select');
    const newChatBtn    = $('new-chat-btn');
    const clearBtn      = $('clear-btn');
    const sidebarToggle = $('sidebar-toggle');
    const sidebar       = $('sidebar');
    const recordOverlay = $('record-overlay');
    const stopRecordBtn = $('stop-record-btn');
    const recordStatus  = $('record-status');
    const ttsBar        = $('tts-bar');
    const stopTtsBtn    = $('stop-tts-btn');
    const autoSpeakEl   = $('auto-speak-toggle');
    const voiceOnlyEl   = $('voice-only-toggle');
    const ttsProviderEl = $('tts-provider');
    const sttProviderEl = $('stt-provider');
    const chatTitle     = $('chat-title');
    const voiceBadge    = $('voice-badge');

    // ── Init ────────────────────────────────────────────────
    (async function init() {
      showWelcome();
      await checkHealth();
      await loadModels();
      bindEvents();
    })();

    // ── Welcome screen ───────────────────────────────────────
    function showWelcome() {
      messagesEl.innerHTML = `
        <div class="welcome">
          <svg class="welcome-logo" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="wlg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f43f5e"/>
                <stop offset="100%" stop-color="#a855f7"/>
              </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="90" fill="url(#wlg)" opacity="0.12"/>
            <rect x="48" y="58" width="104" height="98" rx="22" fill="url(#wlg)" opacity="0.95"/>
            <!-- Eyes -->
            <circle cx="82"  cy="96" r="14" fill="white" opacity="0.92"/>
            <circle cx="118" cy="96" r="14" fill="white" opacity="0.92"/>
            <circle cx="85"  cy="99" r="7"  fill="#1a060c"/>
            <circle cx="121" cy="99" r="7"  fill="#1a060c"/>
            <circle cx="88"  cy="96" r="2.5" fill="white"/>
            <circle cx="124" cy="96" r="2.5" fill="white"/>
            <!-- Mouth -->
            <rect x="70" y="124" width="60" height="14" rx="7" fill="white" opacity="0.85"/>
            <rect x="78"  y="127" width="9" height="8" rx="3" fill="#1a060c"/>
            <rect x="95"  y="127" width="9" height="8" rx="3" fill="#1a060c"/>
            <rect x="112" y="127" width="9" height="8" rx="3" fill="#1a060c"/>
            <!-- Antenna -->
            <rect x="97" y="36" width="6" height="22" rx="3" fill="url(#wlg)"/>
            <circle cx="100" cy="30" r="9"  fill="#a855f7"/>
            <circle cx="100" cy="30" r="4"  fill="white"/>
            <!-- Ears -->
            <rect x="26" y="72" width="22" height="38" rx="9" fill="url(#wlg)" opacity="0.75"/>
            <rect x="152" y="72" width="22" height="38" rx="9" fill="url(#wlg)" opacity="0.75"/>
            <line x1="33" y1="84"  x2="42" y2="84"  stroke="white" stroke-width="1.5" opacity="0.7"/>
            <line x1="33" y1="91"  x2="42" y2="91"  stroke="white" stroke-width="1.5" opacity="0.7"/>
            <line x1="33" y1="98"  x2="42" y2="98"  stroke="white" stroke-width="1.5" opacity="0.7"/>
            <line x1="158" y1="84"  x2="167" y2="84"  stroke="white" stroke-width="1.5" opacity="0.7"/>
            <line x1="158" y1="91"  x2="167" y2="91"  stroke="white" stroke-width="1.5" opacity="0.7"/>
            <line x1="158" y1="98"  x2="167" y2="98"  stroke="white" stroke-width="1.5" opacity="0.7"/>
          </svg>
          <h1>AI Voice Chat</h1>
          <p>Chat by typing, or press the mic to speak.<br>Voice input gives you a <strong style="color:#a855f7">voice-only</strong> AI response — no text shown.</p>
          <button class="welcome-mic-btn" id="welcome-mic-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M5 10a7 7 0 0 0 14 0"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="8" y1="22" x2="16" y2="22"/>
            </svg>
          </button>
          <p class="welcome-hint">Tap the mic to start speaking</p>
          <div class="welcome-chips">
            <button class="chip" data-prompt="What can you help me with?">What can you help me with?</button>
            <button class="chip" data-prompt="Explain quantum computing simply.">Explain quantum computing</button>
            <button class="chip" data-prompt="Write a short poem about the stars.">Write a poem</button>
            <button class="chip" data-prompt="What are the best programming languages to learn in 2026?">Best languages to learn</button>
          </div>
        </div>`;
      bindWelcomeEvents();
    }

    function bindWelcomeEvents() {
      const wm = $('welcome-mic-btn');
      if (wm) wm.addEventListener('click', toggleRecording);
      document.querySelectorAll('.chip').forEach(chip =>
        chip.addEventListener('click', () => {
          msgInput.value = chip.dataset.prompt;
          sendMessage(false);
        })
      );
    }

    // ── Health ───────────────────────────────────────────────
    async function checkHealth() {
      try {
        const res  = await fetch(`${API}/api/health`);
        const data = await res.json();
        setStatus('ollama', data.ollama === 'connected', data.ollama);
        setStatus('sarvam', data.sarvam === 'configured', data.sarvam);
      } catch {
        setStatus('ollama', false, 'unreachable');
        setStatus('sarvam', false, '?');
      }
    }

    function setStatus(svc, ok, text) {
      const dot = $(`dot-${svc}`);
      const txt = $(`txt-${svc}`);
      dot.className = 'status-dot ' + (ok ? 'ok' : 'error');
      if (txt) txt.textContent = text;
    }

    // ── Models ───────────────────────────────────────────────
    async function loadModels() {
      try {
        const res  = await fetch(`${API}/api/models`);
        const data = await res.json();
        modelSelect.innerHTML = '';
        data.models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m; opt.textContent = m;
          if (m === data.default) opt.selected = true;
          modelSelect.appendChild(opt);
        });
      } catch {
        modelSelect.innerHTML = '<option value="llama3.2">llama3.2</option>';
      }
    }

    // ── Events ───────────────────────────────────────────────
    function bindEvents() {
      sendBtn.addEventListener('click', () => sendMessage(false));
      msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(false); }
      });
      msgInput.addEventListener('input', autoResize);
      micBtn.addEventListener('click', toggleRecording);
      stopRecordBtn.addEventListener('click', stopRecording);
      newChatBtn.addEventListener('click', clearChat);
      clearBtn.addEventListener('click', clearChat);
      sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('collapsed'));
      stopTtsBtn.addEventListener('click', stopSpeaking);
    }

    function autoResize() {
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 160) + 'px';
    }

    // ── Send message ─────────────────────────────────────────
    async function sendMessage(isVoiceInput) {
      const text = msgInput.value.trim();
      if (!text || isStreaming) return;

      const welcome = document.querySelector('.welcome');
      if (welcome) welcome.remove();

      if (history.length === 0) {
        chatTitle.textContent = text.slice(0, 44) + (text.length > 44 ? '…' : '');
      }

      // Determine if this response should be voice-only
      const voiceOnly = isVoiceInput && voiceOnlyEl.checked;

      if (isVoiceInput) {
        voiceBadge.style.display = 'inline-block';
        addVoiceUserBubble(text);
      } else {
        addBubble('user', text);
      }

      history.push({ role: 'user', content: text });
      msgInput.value = '';
      autoResize();
      sendBtn.disabled = true;
      isStreaming = true;

      const typingId = addTyping();
      let fullResponse = '';
      let aiMsgEl     = null;
      let voiceCard   = null;

      try {
        const res = await fetch(`${API}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message:  text,
            model:    modelSelect.value,
            history:  history.slice(0, -1),
          }),
        });

        removeTyping(typingId);
        if (!res.ok || !res.body) {
          const errText = await res.text().catch(() => '');
          throw new Error(errText || `Chat request failed (${res.status})`);
        }

        if (voiceOnly) {
          voiceCard = addVoiceCard();
        } else {
          aiMsgEl = addBubble('ai', '');
        }

        const bubble  = aiMsgEl ? aiMsgEl.querySelector('.msg-bubble') : null;
        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6).trim();
            if (!raw) continue;
            try {
              const data = JSON.parse(raw);
              if (data.error) {
                const errHtml = `<span class="msg-error">${escHtml(data.error)}</span>`;
                if (bubble)    bubble.innerHTML = errHtml;
                if (voiceCard) voiceCard.querySelector('.voice-card-label').textContent = 'Error: ' + data.error;
                return;
              }
              if (data.content) {
                fullResponse += data.content;
                if (bubble) { bubble.textContent = fullResponse; scrollBottom(); }
              }
              if (data.done) break;
            } catch { /* skip bad JSON */ }
          }
        }

        if (fullResponse) {
          history.push({ role: 'assistant', content: fullResponse });
        }

        if (voiceOnly && fullResponse) {
          // Update card state: speaking
          const label = voiceCard.querySelector('.voice-card-label');
          const sub   = voiceCard.querySelector('.voice-card-sub');
          if (label) label.textContent = 'Speaking...';
          if (sub)   sub.textContent   = 'Voice-only response active';

          await speakText(fullResponse);

          // Done
          voiceCard.classList.add('done');
          if (label) label.textContent = 'Voice response complete';
          if (sub)   sub.textContent   = 'Tap Replay to hear again';
          const replayBtn = voiceCard.querySelector('.replay-btn');
          if (replayBtn) {
            replayBtn.style.display = 'inline-block';
            replayBtn.addEventListener('click', () => speakText(fullResponse));
          }
        } else if (!voiceOnly && autoSpeakEl.checked && fullResponse) {
          await speakText(fullResponse);
        } else if (!fullResponse) {
          if (voiceCard) {
            const label = voiceCard.querySelector('.voice-card-label');
            const sub   = voiceCard.querySelector('.voice-card-sub');
            voiceCard.classList.add('done');
            if (label) label.textContent = 'No response received';
            if (sub)   sub.textContent   = 'Try again or switch model';
          }
          if (bubble) {
            bubble.innerHTML = '<span class="msg-error">No response received from model.</span>';
          }
        }

      } catch (err) {
        removeTyping(typingId);
        if (!aiMsgEl) aiMsgEl = addBubble('ai', '');
        aiMsgEl.querySelector('.msg-bubble').innerHTML =
          `<span class="msg-error">Network error: ${escHtml(err.message)}</span>`;
      } finally {
        isStreaming = false;
        sendBtn.disabled = false;
        msgInput.focus();
        scrollBottom();
      }
    }

    // ── Bubble helpers ───────────────────────────────────────
    function addBubble(role, text) {
      const msg    = document.createElement('div');
      msg.className = `msg ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'user' ? 'You' : 'AI';

      const body   = document.createElement('div');
      body.className = 'msg-body';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerHTML = `<span>${timestamp()}</span>`;

      if (role === 'ai') {
        const speakBtn = document.createElement('button');
        speakBtn.className = 'speak-msg-btn';
        speakBtn.title = 'Speak this message';
        speakBtn.textContent = '\uD83D\uDD0A';
        speakBtn.addEventListener('click', () => speakText(bubble.textContent));
        meta.appendChild(speakBtn);
      }

      body.append(bubble, meta);
      msg.append(avatar, body);
      messagesEl.appendChild(msg);
      scrollBottom();
      return msg;
    }

    function addVoiceUserBubble(text) {
      const msg = document.createElement('div');
      msg.className = 'msg user';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = 'You';

      const body = document.createElement('div');
      body.className = 'msg-body';

      const bubble = document.createElement('div');
      bubble.className = 'voice-user-bubble';
      bubble.innerHTML = `<span class="voice-icon">&#127897;</span><span>${escHtml(text)}</span>`;

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerHTML = `<span>${timestamp()}</span><span style="color:var(--accent2);font-size:0.68rem">Voice input</span>`;

      body.append(bubble, meta);
      msg.append(avatar, body);
      messagesEl.appendChild(msg);
      scrollBottom();
    }

    function addVoiceCard() {
      const msg = document.createElement('div');
      msg.className = 'msg ai';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = 'AI';

      const body = document.createElement('div');
      body.className = 'msg-body';

      const card = document.createElement('div');
      card.className = 'voice-card';
      card.innerHTML = `
        <div class="voice-waveform">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="voice-card-info">
          <span class="voice-card-label">Generating response...</span>
          <span class="voice-card-sub">Voice-only mode</span>
        </div>
        <button class="replay-btn">&#8617; Replay</button>`;

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerHTML = `<span>${timestamp()}</span>`;

      body.append(card, meta);
      msg.append(avatar, body);
      messagesEl.appendChild(msg);
      scrollBottom();
      return card;
    }

    function addTyping() {
      const id  = 'typing-' + Date.now();
      const div = document.createElement('div');
      div.className = 'msg ai';
      div.id = id;
      div.innerHTML = `
        <div class="msg-avatar">AI</div>
        <div class="msg-body">
          <div class="msg-bubble" style="padding:14px 18px;background:var(--ai-bg);border:1px solid var(--border)">
            <div class="typing-dots"><span></span><span></span><span></span></div>
          </div>
        </div>`;
      messagesEl.appendChild(div);
      scrollBottom();
      return id;
    }

    function removeTyping(id) { const el = $(id); if (el) el.remove(); }
    function scrollBottom()   { messagesEl.scrollTop = messagesEl.scrollHeight; }
    function timestamp()      { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
    function escHtml(str)     { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function showToast(message, type = 'error') {
      const container = $('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3100);
    }

    // ── Voice recording ──────────────────────────────────────
    async function toggleRecording() {
      if (sttProviderEl.value === 'browser') {
        if (browserRecognition) {
          stopRecording();
          return;
        }
        browserSTT();
        return;
      }

      if (mediaRecorder && mediaRecorder.state === 'recording') { stopRecording(); return; }
      startRecording();
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks  = [];

        const opts = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? { mimeType: 'audio/webm;codecs=opus' } : {};

        mediaRecorder = new MediaRecorder(stream, opts);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = handleRecordingStop;
        mediaRecorder.start(250);

        micBtn.classList.add('recording');
        recordOverlay.classList.add('active');
        recordStatus.textContent = 'Listening...';
      } catch (err) {
        showToast('Microphone access denied: ' + err.message);
      }
    }

    function stopRecording() {
      if (browserRecognition) {
        try { browserRecognition.stop(); } catch (_) {}
        browserRecognition = null;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
      micBtn.classList.remove('recording');
      recordOverlay.classList.remove('active');
    }

    async function handleRecordingStop() {
      if (audioChunks.length === 0) return;
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      // MediaRecorder is only used when Sarvam STT is selected;
      // browser STT uses the Web Speech API and never triggers this path.
      await sarvamSTT(blob);
    }

    async function blobToWav(blob) {
      const arrayBuffer = await blob.arrayBuffer();
      const audioCtx = new AudioContext();
      const decoded = await audioCtx.decodeAudioData(arrayBuffer);
      audioCtx.close();

      const numChannels = 1;
      const sampleRate = decoded.sampleRate;
      const channelData = decoded.getChannelData(0);
      const numSamples = channelData.length;

      const buffer = new ArrayBuffer(44 + numSamples * 2);
      const view = new DataView(buffer);

      const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + numSamples * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, numSamples * 2, true);
      for (let i = 0; i < numSamples; i++) {
        const s = Math.max(-1, Math.min(1, channelData[i]));
        view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    async function sarvamSTT(blob) {
      // Re-show overlay while waiting for transcription (stopRecording hid it)
      recordOverlay.classList.add('active');
      recordStatus.textContent = 'Transcribing...';
      try {
        const wavBlob = await blobToWav(blob);
        const fd = new FormData();
        fd.append('audio', wavBlob, 'recording.wav');
        const res = await fetch(`${API}/api/stt`, { method: 'POST', body: fd });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        const transcript = (data.transcript || '').trim();
        if (transcript) {
          msgInput.value = transcript;
          autoResize();
          sendMessage(true);   // voice input
        } else {
          showToast('No speech detected. Please try again.', 'warning');
        }
      } catch (err) {
        console.error('STT error:', err);
        showToast('STT failed: ' + err.message);
      } finally {
        recordOverlay.classList.remove('active');
      }
    }

    function browserSTT() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { showToast('Browser Speech Recognition not supported. Switch to Sarvam.ai STT.', 'warning'); return; }
      const rec = new SR();
      browserRecognition = rec;
      rec.lang = 'en-IN';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      micBtn.classList.add('recording');
      recordOverlay.classList.add('active');
      recordStatus.textContent = 'Listening...';
      rec.onresult = e => {
        const transcript = e.results[0][0].transcript;
        msgInput.value = transcript;
        autoResize();
        sendMessage(true); // voice input
      };
      rec.onerror = e => {
        console.error('Speech recognition error:', e.error);
        showToast('Browser STT error: ' + e.error, 'warning');
      };
      rec.onend = () => {
        browserRecognition = null;
        micBtn.classList.remove('recording');
        recordOverlay.classList.remove('active');
      };
      rec.start();
    }

    // ── TTS ──────────────────────────────────────────────────
    async function speakText(text) {
      stopSpeaking();
      if (ttsProviderEl.value === 'sarvam') {
        await sarvamTTS(text);
      } else {
        await browserTTS(text);
      }
    }

    async function sarvamTTS(text) {
      showTtsBar(true);
      try {
        const res = await fetch(`${API}/api/tts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text.slice(0, 500), language: 'en-IN', speaker: 'anushka' }),
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        if (!data.audio) throw new Error('No audio returned');

        const binary = atob(data.audio);
        const bytes  = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const blob = new Blob([bytes], { type: 'audio/wav' });
        const url  = URL.createObjectURL(blob);

        return new Promise(resolve => {
          currentAudio = new Audio(url);
          currentAudio.onended = () => { showTtsBar(false); URL.revokeObjectURL(url); resolve(); };
          currentAudio.onerror = () => { showTtsBar(false); resolve(); };
          currentAudio.play();
        });
      } catch (err) {
        showTtsBar(false);
        console.error('Sarvam TTS error:', err);
        return browserTTS(text);   // graceful fallback
      }
    }

    function browserTTS(text) {
      if (!window.speechSynthesis) return Promise.resolve();
      showTtsBar(true);
      return new Promise(resolve => {
        currentUtterance = new SpeechSynthesisUtterance(text);
        currentUtterance.lang  = 'en-IN';
        currentUtterance.rate  = 1.0;
        currentUtterance.pitch = 1.0;
        currentUtterance.onend   = () => { showTtsBar(false); resolve(); };
        currentUtterance.onerror = () => { showTtsBar(false); resolve(); };
        window.speechSynthesis.speak(currentUtterance);
      });
    }

    function stopSpeaking() {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      currentUtterance = null;
      showTtsBar(false);
    }

    function showTtsBar(show) { ttsBar.style.display = show ? 'flex' : 'none'; }

    // ── Chat management ──────────────────────────────────────
    function clearChat() {
      stopSpeaking();
      history = [];
      isStreaming = false;
      sendBtn.disabled = false;
      chatTitle.textContent = 'New Conversation';
      voiceBadge.style.display = 'none';
      showWelcome();
    }
  </script>
